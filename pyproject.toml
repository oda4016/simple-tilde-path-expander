[project]
name = "simple-tilde-path-expander"
version = "0.1.1"
description = "Turns a leading ~ into a home directory and cleans up the rest of the path."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
